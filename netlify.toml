# Netlify: the MyBus web app (Angular). The API runs separately (render.yaml).
# Required site environment variable: API_BASE_URL = the API URL, e.g. https://mybus-api.onrender.com
# frontend/scripts/deploy-config.mjs writes config.js and _redirects into the build output; there are no redirect
# rules in this file, so _redirects is the single source of truth.

[build]
  base = "frontend"
  command = "npm ci && node scripts/deploy-config.mjs --check && npm run build && node scripts/deploy-config.mjs"
  publish = "dist/frontend/browser"

[build.environment]
  NODE_VERSION = "24"
  NG_CLI_ANALYTICS = "false"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Always check for a new version: the app shell, its runtime settings and the push service worker.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/push-sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Build files with a content hash in their name never change.
[[headers]]
  for = "/main-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/chunk-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/polyfills-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
